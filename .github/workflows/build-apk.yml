name: Build Android Demo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -q Telebirr-clone-by-biruk-main.zip
          cd Telebirr-clone-by-biruk-main
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        working-directory: Telebirr-clone-by-biruk-main
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: telebirr-demo-apk
          path: Telebirr-clone-by-biruk-main/build/app/outputs/flutter-apk/app-release.apk
